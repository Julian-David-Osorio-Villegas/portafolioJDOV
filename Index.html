/* ===============================

 :root {

  --color-text: #374151;

    /* ====== Estilos generales ====== */
    body {
      margin: 0;
      padding: 0;
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 2rem;
      background: var(--color-primary);
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    header p {
      font-size: 1.2rem;
      color: #e5e7eb;
    }

    section {
      padding: 2rem;
      display: grid;
      gap: 2rem;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    }

    article {
      background: #f9fafb;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    article h2 {
      margin-top: 0;
      color: var(--color-primary);
    }

    article p {
      color: var(--color-text-secondary);
    }

    button {
      margin-top: 1rem;
      background-color: var(--color-primary);
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: var(--color-accent);
    }

    footer {
      background: var(--color-primary);
      color: #fff;
      text-align: center;
      padding: 2rem;
      margin-top: 2rem;
    }

    footer a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.3s;
    }

    footer a:hover {
      color: var(--color-accent);
    }
  </style>
</head>
